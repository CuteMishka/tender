name: tender

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tender}
    volumes:
      - tender_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender} -d ${POSTGRES_DB:-tender}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  rag-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RAG_POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?RAG_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${RAG_POSTGRES_DB:-rag}
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
      - ./tender-rag/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${RAG_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_POSTGRES_USER:-rag} -d ${RAG_POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ./tenderai
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    restart: unless-stopped
    environment:
      PORT: "8082"
      DATABASE_URL: host=postgres user=${POSTGRES_USER:-tender} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-tender} port=5432 sslmode=disable TimeZone=Asia/Almaty
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tender.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PARSER_RUNNER_MODE: vm
      TENDERPLUS_URL: ${TENDERPLUS_URL:-https://api.tenderplus.kz/graphql}
      TENDERPLUS_TOKEN: ${TENDERPLUS_TOKEN:-}
      TENDERS_KEYWORDS: ${TENDERS_KEYWORDS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FETCH_DOCUMENT_ALLOWED_HOSTS: ${FETCH_DOCUMENT_ALLOWED_HOSTS:-v3bl.goszakup.gov.kz,goszakup.gov.kz,zakup.gov.kz,ows.goszakup.gov.kz,api.tenderplus.kz,.tenderplus.kz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  rag-api:
    build:
      context: ./tender-rag
    restart: unless-stopped
    environment:
      PORT: "8083"
      DATABASE_URL: postgresql://${RAG_POSTGRES_USER:-rag}:${RAG_POSTGRES_PASSWORD}@rag-db:5432/${RAG_POSTGRES_DB:-rag}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      FILES_DIR: /files
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      LOT_ANALYZE_AI_PROVIDER: ${LOT_ANALYZE_AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-ollama}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-http://llm:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-2.5-flash}
      LOT_ANALYZE_CHAT_MODEL: ${LOT_ANALYZE_CHAT_MODEL:-gemini-2.5-flash}
      SPEC_AI_PROVIDER: ${SPEC_AI_PROVIDER:-gemini}
      SPEC_CHAT_MODEL: ${SPEC_CHAT_MODEL:-gemini-2.5-flash}
      CLOUDY_AI_PROVIDER: ${CLOUDY_AI_PROVIDER:-groq}
      CLOUDY_CHAT_MODEL: ${CLOUDY_CHAT_MODEL:-qwen2.5:14b}
      COMPANY_PROFILE: ${COMPANY_PROFILE:-}
      COMPANY_PROFILE_FILE: ${COMPANY_PROFILE_FILE:-/files/company_profile.txt}
    volumes:
      - ./tender-rag/files:/files:ro
    expose:
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=5).read()\""]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    depends_on:
      rag-db:
        condition: service_healthy
      llm:
        condition: service_healthy
    logging: *default-logging

  parser:
    build:
      context: ./parser
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tender}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tender}
      RAG_API_BASE: http://rag-api:8083
      DICTIONARIES_API_URL: http://backend:8082/api/v1/dictionaries?kind=keywords
      POLL_INTERVAL_SECONDS: ${PARSER_POLL_INTERVAL_SECONDS:-1800}
      MAX_WORKERS: ${PARSER_MAX_WORKERS:-2}
      HEADLESS: "true"
      DOWNLOAD_DIR: /app/downloads
      STRICT_KEYWORD_FILTER: ${STRICT_KEYWORD_FILTER:-false}
      COLLECT_ALL_ACTIVE_LOTS: ${COLLECT_ALL_ACTIVE_LOTS:-true}
      SMART_MATCH_ENABLED: ${SMART_MATCH_ENABLED:-true}
      SMART_MATCH_USE_MORPHOLOGY: ${SMART_MATCH_USE_MORPHOLOGY:-true}
      SEMANTIC_MATCH_ENABLED: ${SEMANTIC_MATCH_ENABLED:-false}
      AI_LOT_FILTER_ENABLED: ${PARSER_AI_LOT_FILTER_ENABLED:-true}
      AI_LOT_FILTER_MIN_SCORE: ${AI_LOT_FILTER_MIN_SCORE:-65}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-ollama}
      GROQ_API_BASE: ${GROQ_API_BASE:-http://llm:11434/v1}
      GROQ_MODEL: ${GROQ_MODEL:-qwen2.5:14b}
      AI_REQUEST_DELAY_SECONDS: ${AI_REQUEST_DELAY_SECONDS:-5}
      AI_RATE_LIMIT_COOLDOWN_SECONDS: ${AI_RATE_LIMIT_COOLDOWN_SECONDS:-300}
      STOP_AT_FIRST_SEEN_LOT: ${PARSER_STOP_AT_FIRST_SEEN_LOT:-true}
      PROCESS_EXISTING_LOTS: ${PARSER_PROCESS_EXISTING_LOTS:-false}
      MAX_LOTS_PER_CYCLE: ${PARSER_MAX_LOTS_PER_CYCLE:-10}
      PLATFORMS: ${PLATFORMS:-tenderplus}
      DEFAULT_KEYWORDS: ${DEFAULT_KEYWORDS:-}
      GOSZAKUP_BASE_URL: ${GOSZAKUP_BASE_URL:-https://goszakup.gov.kz}
      GOSZAKUP_SEARCH_URL: ${GOSZAKUP_SEARCH_URL:-https://goszakup.gov.kz/ru/search/lots}
      GOSZAKUP_LOTS_COUNT_RECORD: ${GOSZAKUP_LOTS_COUNT_RECORD:-50}
      GOSZAKUP_LOTS_MAX_PAGES: ${PARSER_GOSZAKUP_LOTS_MAX_PAGES:-3}
      GOSZAKUP_OWS_TOKEN: ${GOSZAKUP_OWS_TOKEN:-}
      GOSZAKUP_OWS_BASE_URL: ${GOSZAKUP_OWS_BASE_URL:-https://ows.goszakup.gov.kz}
      GOSZAKUP_OWS_GRAPHQL_URL: ${GOSZAKUP_OWS_GRAPHQL_URL:-https://ows.goszakup.gov.kz/v3/graphql}
      ZAKUP_PUBLIC_BASE_URL: ${ZAKUP_PUBLIC_BASE_URL:-https://zakup.gov.kz}
      ZAKUP_LOTS_URL: ${ZAKUP_LOTS_URL:-https://zakup.gov.kz/home/lots}
      ZAKUP_LOTS_LIMIT: ${ZAKUP_LOTS_LIMIT:-100}
      ZAKUP_LOTS_MAX_PAGES: ${PARSER_ZAKUP_LOTS_MAX_PAGES:-3}
      ZAKUP_LOTS_SYSTEM_IDS: ${ZAKUP_LOTS_SYSTEM_IDS:-}
      ZAKUP_OWS_LIMIT_PER_PAGE: ${ZAKUP_OWS_LIMIT_PER_PAGE:-200}
      ZAKUP_OWS_MAX_PAGES_PER_KEYWORD: ${ZAKUP_OWS_MAX_PAGES_PER_KEYWORD:-0}
      TENDERPLUS_URL: ${TENDERPLUS_URL:-https://api.tenderplus.kz/graphql}
      TENDERPLUS_TOKEN: ${TENDERPLUS_TOKEN:-}
      TENDERPLUS_PAGE_SIZE: ${TENDERPLUS_PAGE_SIZE:-25}
      TENDERPLUS_MAX_PAGES: ${TENDERPLUS_MAX_PAGES:-2}
      TENDERPLUS_MAX_LOTS: ${TENDERPLUS_MAX_LOTS:-50}
      TENDERPLUS_INCLUDE_DOCUMENTS: ${TENDERPLUS_INCLUDE_DOCUMENTS:-true}
      TENDERPLUS_DOCUMENT_MAX_DOWNLOADS: ${TENDERPLUS_DOCUMENT_MAX_DOWNLOADS:-2}
      TENDERPLUS_RAG_INDEX_DOCUMENTS: ${TENDERPLUS_RAG_INDEX_DOCUMENTS:-false}
      OUR_BINS: ${OUR_BINS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REQUEST_TIMEOUT_SECONDS: ${PARSER_REQUEST_TIMEOUT_SECONDS:-30}
    volumes:
      - parser_downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    logging: *default-logging

  llm:
    image: ollama/ollama:latest
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${LLM_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./tenderflow-admin
      args:
        VITE_BACK_API: ${PUBLIC_BACKEND_URL:-}
        VITE_LOCAL_API: ${PUBLIC_BACKEND_URL:-}
        VITE_RAG_API: ${PUBLIC_RAG_URL:-}
        VITE_FETCH_DOCUMENT_PROXY_URL: ${PUBLIC_FETCH_DOCUMENT_PROXY_URL:-}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8082:80"
      - "8083:8083"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    logging: *default-logging

volumes:
  tender_postgres_data:
    external: true
    name: ${TENDER_POSTGRES_VOLUME:-cloud-user_tender_postgres_data}
  rag_postgres_data:
    external: true
    name: ${RAG_POSTGRES_VOLUME:-cloud-user_rag_postgres_data}
  parser_downloads:
    external: true
    name: ${PARSER_DOWNLOADS_VOLUME:-cloud-user_parser_downloads}
  ollama_data:
    external: true
    name: ${OLLAMA_VOLUME:-cloud-user_ollama_data}
