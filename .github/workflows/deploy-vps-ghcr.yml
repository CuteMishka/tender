name: Deploy VPS via GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-vps-ghcr.yml"
      - "docker-compose.prod.yml"
      - "docker-compose.ghcr.yml"
      - "scripts/deploy_ghcr_vm.sh"
      - "scripts/enqueue_parser_vm.sh"
      - "scripts/rotate_vm_database_credentials.sh"
      - "ops/**"
      - "tenderai/**"
      - "parser/**"
      - "tender-rag/**"
      - "tenderflow-admin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-production
  # Never terminate a deployment between database shutdown and health checks.
  cancel-in-progress: false

env:
  APP_DIR: /home/cloud-user/tender1
  PUBLIC_ORIGIN: https://qolab.kz

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tenderflow-admin/package-lock.json

      - name: Audit and test frontend
        working-directory: tenderflow-admin
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          node --import tsx --test src/lib/auth.test.ts src/lib/tenders-api.test.ts

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: tenderai/go.sum

      - name: Test backend
        working-directory: tenderai
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q parser tender-rag/app

      - name: Test internal service authentication
        env:
          PYTHONPATH: parser:tender-rag
        run: |
          python -m pip install --disable-pip-version-check -q fastapi httpx pytest pydantic-settings structlog SQLAlchemy==2.0.36
          PYTHONPATH=parser python -m pytest -q parser/tests/test_internal_auth.py
          PYTHONPATH=tender-rag python -m pytest -q tender-rag/tests/test_internal_auth.py tender-rag/tests/test_health.py

      - name: Validate deployment files
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          RAG_POSTGRES_PASSWORD: ci-only-rag-password
          BACKEND_INTERNAL_SERVICE_TOKEN: ci-only-backend-service-token-at-least-32-characters
          RAG_INTERNAL_SERVICE_TOKEN: ci-only-rag-service-token-at-least-32-characters
        run: |
          bash -n scripts/deploy_ghcr_vm.sh
          bash -n scripts/enqueue_parser_vm.sh
          bash -n ops/backup/tender-backup.sh
          bash -n ops/firewall/tender-docker-firewall.sh
          bash -n ops/harden_host.sh
          bash -n ops/access/create_readonly_db_user.sh
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ghcr.yml \
            config --quiet

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        env:
          PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
          PUBLIC_RAG_URL: ${{ vars.PUBLIC_RAG_URL }}
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="$GITHUB_SHA"
          if [[ ! "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full commit SHA" >&2
            exit 1
          fi
          backend_url="${PUBLIC_BACKEND_URL:-$PUBLIC_ORIGIN}"
          rag_url="${PUBLIC_RAG_URL:-$PUBLIC_ORIGIN/api/v1/rag}"
          printf 'image_prefix=ghcr.io/%s\n' "$repo" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'public_backend_url=%s\n' "$backend_url" >> "$GITHUB_OUTPUT"
          printf 'public_rag_url=%s\n' "$rag_url" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite immutable commit tags
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          for service in backend parser rag-api frontend; do
            image="$IMAGE_PREFIX/$service:$IMAGE_TAG"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Immutable image tag already exists: $image" >&2
              exit 1
            fi
          done

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./tenderai
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_prefix }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build parser
        uses: docker/build-push-action@v6
        with:
          context: ./parser
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/parser:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_prefix }}/parser:latest
          cache-from: type=gha,scope=parser
          cache-to: type=gha,scope=parser,mode=max

      - name: Build RAG API
        uses: docker/build-push-action@v6
        with:
          context: ./tender-rag
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/rag-api:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_prefix }}/rag-api:latest
          cache-from: type=gha,scope=rag-api
          cache-to: type=gha,scope=rag-api,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./tenderflow-admin
          push: true
          build-args: |
            VITE_BACK_API=${{ steps.meta.outputs.public_backend_url }}
            VITE_LOCAL_API=${{ steps.meta.outputs.public_backend_url }}
            VITE_RAG_API=${{ steps.meta.outputs.public_rag_url }}
            VITE_FETCH_DOCUMENT_PROXY_URL=${{ steps.meta.outputs.public_backend_url }}/api/v1/fetch-document
          tags: |
            ${{ steps.meta.outputs.image_prefix }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_prefix }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          # The VPS address is public infrastructure metadata; keep a safe
          # fallback so a blank legacy secret cannot silently skip deployment.
          VPS_HOST: ${{ secrets.VPS_HOST || '85.116.182.35' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Upload compose files and deploy script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '85.116.182.35' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ env.APP_DIR }}
        run: |
          user="${VPS_USER:-cloud-user}"
          files=(
            docker-compose.prod.yml
            docker-compose.ghcr.yml
            scripts/deploy_ghcr_vm.sh
            scripts/enqueue_parser_vm.sh
            scripts/rotate_vm_database_credentials.sh
            tender-rag/db/init.sql
            ops
          )
          if [ -f tender-rag/files/company_profile.txt ]; then
            files+=(tender-rag/files/company_profile.txt)
          fi
          # Keep the deployment within one SSH connection.  The host deliberately
          # rate-limits SSH and GitHub runners otherwise open too many short-lived
          # scp/ssh sessions in one minute.
          tar -czf - "${files[@]}" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$user@$VPS_HOST" \
            "mkdir -p '$APP_DIR/scripts' '$APP_DIR/tender-rag/db' '$APP_DIR/tender-rag/files/generated' '$APP_DIR/ops' && tar -xzf - -C '$APP_DIR' && chmod 700 '$APP_DIR/scripts/deploy_ghcr_vm.sh' '$APP_DIR/scripts/enqueue_parser_vm.sh' '$APP_DIR/scripts/rotate_vm_database_credentials.sh' '$APP_DIR/ops/harden_host.sh'"

      - name: Pull images and restart services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '85.116.182.35' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ env.APP_DIR }}
          GHCR_IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          user="${VPS_USER:-cloud-user}"
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag" >&2
            exit 1
          fi
          printf -v q_app_dir '%q' "$APP_DIR"
          printf -v q_image_prefix '%q' "$GHCR_IMAGE_PREFIX"
          printf -v q_image_tag '%q' "$IMAGE_TAG"
          printf -v q_ghcr_username '%q' "$GHCR_USERNAME"
          printf -v q_deploy_script '%q' "$APP_DIR/scripts/deploy_ghcr_vm.sh"
          printf -v q_rotate_script '%q' "$APP_DIR/scripts/rotate_vm_database_credentials.sh"
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$user@$VPS_HOST" "
            set -euo pipefail
            sudo docker login ghcr.io -u $q_ghcr_username --password-stdin >/dev/null
            cleanup() { sudo docker logout ghcr.io >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            export APP_DIR=$q_app_dir
            export GHCR_IMAGE_PREFIX=$q_image_prefix
            export IMAGE_TAG=$q_image_tag
            for service in backend parser rag-api frontend; do
              sudo docker pull \"$q_image_prefix/\$service:$q_image_tag\" >/dev/null
            done
            sudo env APP_DIR=$q_app_dir GHCR_IMAGE_PREFIX=$q_image_prefix IMAGE_TAG=$q_image_tag bash $q_rotate_script
            bash $q_deploy_script
          "
          if ! curl --retry 10 --retry-all-errors --retry-delay 3 --max-time 15 -fsS "$PUBLIC_ORIGIN/healthz" >/dev/null; then
            echo "::warning::External healthz check did not return 2xx; deployment itself passed on-VPS checks."
          fi
          public_api_status="$(curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$PUBLIC_ORIGIN/api/v1/tenders")"
          public_rag_status="$(curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$PUBLIC_ORIGIN/rag/health")"
          if [ "$public_api_status" != "401" ]; then
            echo "::warning::External protected API returned $public_api_status (expected 401)."
          fi
          if [ "$public_rag_status" != "404" ]; then
            echo "::warning::External direct RAG route returned $public_rag_status (expected 404)."
          fi
