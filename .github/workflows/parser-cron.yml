name: Parser schedule

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        type: choice
        required: true
        default: parse
        options:
          - parse
          - reanalyze_existing

permissions:
  contents: read

concurrency:
  group: parser-schedule
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_DIR: /home/cloud-user/tender1
      RUN_MODE: ${{ github.event.inputs.run_mode || 'parse' }}

    steps:
      - name: Install pinned SSH identity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Enqueue over the SSH control plane
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          case "$RUN_MODE" in
            parse|reanalyze_existing) ;;
            *)
              echo "Unsupported run mode: $RUN_MODE" >&2
              exit 1
              ;;
          esac

          user="${VPS_USER:-cloud-user}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$user@$VPS_HOST" \
            "APP_DIR='$APP_DIR' bash '$APP_DIR/scripts/enqueue_parser_vm.sh' '$RUN_MODE'"
