name: Temporary secure production access export

on:
  workflow_dispatch:
    inputs:
      recipient_certificate_b64:
        description: Base64-encoded X.509 recipient certificate
        required: true
        type: string

permissions:
  contents: read

env:
  APP_DIR: /home/cloud-user/tender1

jobs:
  export:
    name: Encrypt access bundle
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '85.116.182.35' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Validate recipient certificate
        env:
          RECIPIENT_CERTIFICATE_B64: ${{ inputs.recipient_certificate_b64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RECIPIENT_CERTIFICATE_B64" |
            base64 --decode > recipient-cert.pem
          openssl x509 -in recipient-cert.pem -noout -checkend 0

      - name: Create encrypted bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '85.116.182.35' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          umask 077
          user="${VPS_USER:-cloud-user}"
          install -m 700 -d bundle

          ssh-keygen -q -t ed25519 -N '' \
            -C 'qolab-developer-handover-2026-07-29' \
            -f bundle/qolab-developer-ssh

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$user@$VPS_HOST" \
            'set -euo pipefail
             umask 077
             install -d -m 700 "$HOME/.ssh"
             touch "$HOME/.ssh/authorized_keys"
             chmod 600 "$HOME/.ssh/authorized_keys"
             key="$(cat)"
             grep -qxF "$key" "$HOME/.ssh/authorized_keys" ||
               printf "%s\n" "$key" >> "$HOME/.ssh/authorized_keys"' \
            < bundle/qolab-developer-ssh.pub

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$user@$VPS_HOST" \
            "sudo test -r '$APP_DIR/.env' &&
             sudo cat '$APP_DIR/.env'" \
            > bundle/production.env

          printf '%s\n' "$VPS_HOST" > bundle/vps-host.txt
          printf '%s\n' "$user" > bundle/vps-user.txt
          cp ~/.ssh/known_hosts bundle/known_hosts

          tar -C bundle -czf - . |
            openssl cms -encrypt -binary -aes-256-cbc \
              -outform DER \
              -recip recipient-cert.pem \
              -out production-access.tar.gz.p7m

          test -s production-access.tar.gz.p7m
          rm -f \
            bundle/qolab-developer-ssh \
            bundle/qolab-developer-ssh.pub \
            bundle/production.env \
            bundle/vps-host.txt \
            bundle/vps-user.txt \
            bundle/known_hosts \
            recipient-cert.pem
          rmdir bundle

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-access-encrypted
          path: production-access.tar.gz.p7m
          if-no-files-found: error
          retention-days: 1
