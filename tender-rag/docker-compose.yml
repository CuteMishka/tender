services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?RAG_POSTGRES_PASSWORD is required}
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:${RAG_POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "127.0.0.1:${RAG_PORT:-8083}:8083"
    # GEMINI_API_KEY и прочие секреты — в файле .env рядом с compose (см. .env.example), не коммитьте .env
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rag:${RAG_POSTGRES_PASSWORD:?RAG_POSTGRES_PASSWORD is required}@db:5432/rag
      RAG_INTERNAL_SERVICE_TOKEN: ${RAG_INTERNAL_SERVICE_TOKEN:?RAG_INTERNAL_SERVICE_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      FILES_DIR: /files
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-2.5-flash}
      COMPANY_PROFILE: ${COMPANY_PROFILE:-}
      COMPANY_PROFILE_FILE: ${COMPANY_PROFILE_FILE:-/files/company_profile.txt}
    volumes:
      - ./files:/files:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
