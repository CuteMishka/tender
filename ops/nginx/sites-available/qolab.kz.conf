server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 85.116.182.35;
    return 308 https://qolab.kz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name qolab.kz www.qolab.kz;
    return 308 https://qolab.kz$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/qolab.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qolab.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 85.116.182.35;

    ssl_certificate /etc/letsencrypt/live/qolab.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qolab.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://qolab.kz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qolab.kz www.qolab.kz;

    ssl_certificate /etc/letsencrypt/live/qolab.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qolab.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/tender-security-headers.conf;
    access_log /var/log/nginx/tender-access.log tender_json;
    error_log /var/log/nginx/tender-error.log warn;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    client_max_body_size 2m;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;
    ignore_invalid_headers on;
    underscores_in_headers off;
    limit_conn tender_conn 40;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=tender_login burst=5 nodelay;
        include /etc/nginx/snippets/tender-proxy.conf;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8082;
    }

    location = /api/v1/auth/register-request {
        limit_req zone=tender_register burst=3 nodelay;
        include /etc/nginx/snippets/tender-proxy.conf;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8082;
    }

    # Go caps this body at 64 MiB. The small Nginx margin accounts for request
    # framing while still rejecting unbounded document uploads at the edge.
    location ~ ^/api/v1/rag/lots/[^/]+/index-document$ {
        limit_req zone=tender_rag burst=5 nodelay;
        client_max_body_size 66m;
        include /etc/nginx/snippets/tender-proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:8082;
    }

    # AI and report generation can legitimately take longer, but remain
    # bounded and rate-limited independently of the general API.
    location ~ ^/api/v1/(?:rag/|tenders/[^/]+/(?:cloudy/chat|spec-summary/auto)|analytics/reports/) {
        limit_req zone=tender_rag burst=10 nodelay;
        client_max_body_size 4m;
        include /etc/nginx/snippets/tender-proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:8082;
    }

    location /api/ {
        limit_req zone=tender_api burst=60 nodelay;
        include /etc/nginx/snippets/tender-proxy.conf;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8082;
    }

    # FastAPI is internal-only. Browser RAG calls go through the authenticated
    # Go proxy under /api/v1/rag/*, which adds the RAG-specific service token.
    location = /rag {
        return 404;
    }

    location ^~ /rag/ {
        return 404;
    }

    location ^~ /v1/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/tender-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:18080;
    }
}
