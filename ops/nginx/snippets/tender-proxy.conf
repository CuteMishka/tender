proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# This VM has one trusted edge proxy. Replacing (rather than appending) XFF
# prevents a public client from injecting the first address consumed by the
# backend's trusted-proxy logic.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-ID $request_id;
# The internal bearer is valid only on Docker/loopback service traffic.
proxy_set_header X-Internal-Service-Token "";

proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_hide_header X-Powered-By;
