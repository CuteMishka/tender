# Loaded inside nginx's http {} block.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=tender_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tender_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tender_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=tender_rag:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tender_conn:10m;

limit_req_status 429;
limit_req_log_level warn;

# Deliberately excludes request bodies, cookies, authorization and CSRF
# headers so secrets do not enter the access log.
log_format tender_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
